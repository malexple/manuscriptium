name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build :app:devHome
        shell: bash
      - name: Build standalone plugin template
        run: ./gradlew -p plugin-template build
        shell: bash
      - name: Smoke test of Gradle run (complete runtime module path)
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:run --args="--smoke" | tee gradle-run-smoke.log
          grep -q "MCS_SMOKE builtIns=\[markdown\] plugins=\[\]" gradle-run-smoke.log
          grep -q "editorProviders=\[core.markdown-fallback, editor.text, markdown.editor\]" gradle-run-smoke.log
          grep -q "builtInFailures={}" gradle-run-smoke.log
      - name: Build runtime image
        run: ./gradlew :app:jlink
        shell: bash
      - name: Smoke test of the runtime image (built-in modules, no bundled plugins)
        shell: bash
        run: |
          test ! -e app/build/image/system-plugins/hello
          test ! -e app/build/image/system-plugins/markdown-editor
          test ! -e app/build/image/system-plugins/markdown-parser
          test ! -e app/build/image/system-plugins/editor-styles
          test ! -e app/build/image/system-plugins/math-renderer
          test ! -e app/build/image/system-plugins/notes
          test ! -e app/build/image/system-plugins/properties
          EXE=app/build/image/bin/manuscriptium
          if [ "$RUNNER_OS" = "Windows" ]; then EXE=$EXE.bat; fi
          "$EXE" --smoke --home=app/build/dev-home | tee smoke.log
          grep -q "MCS_SMOKE builtIns=\[markdown\] plugins=\[\]" smoke.log
          grep -q "editorProviders=\[core.markdown-fallback, editor.text, markdown.editor\]" smoke.log
          grep -q "markdown.editor.toggleMode" smoke.log
          grep -q "toolWindows=\[properties.panel, notes.panel\]" smoke.log
          grep -q "builtInFailures={}" smoke.log
          ! grep -q "ru.mcs.plugin.hello\|ru.mcs.plugin.mdeditor\|ru.mcs.plugin.mdparser" smoke.log
          app/build/image/bin/java --list-modules | grep -q '^org.apache.lucene.core@10.6.0$'
          app/build/image/bin/java --list-modules | grep -q '^ru.mcs.spi$'
          app/build/image/bin/java --list-modules | grep -q '^ru.mcs.spi.swing$'
          app/build/image/bin/java --list-modules | grep -q '^ru.mcs.editor$'
          app/build/image/bin/java --list-modules | grep -q '^ru.mcs.markdown$'
      - name: Smoke test of the runtime image (built-in modules + external template JAR)
        shell: bash
        run: |
          TEMPLATE_DIR=app/build/external-home/plugins/template
          TEMPLATE_JAR=plugin-template/build/libs/manuscriptium-plugin-template-0.1.0.jar
          mkdir -p "$TEMPLATE_DIR"
          cp "$TEMPLATE_JAR" "$TEMPLATE_DIR/template.jar"
          (cd "$TEMPLATE_DIR" && jar xf "$OLDPWD/$TEMPLATE_JAR" plugin.yml)
          EXE=app/build/image/bin/manuscriptium
          if [ "$RUNNER_OS" = "Windows" ]; then EXE=$EXE.bat; fi
          "$EXE" --smoke --home=app/build/external-home | tee external-smoke.log
          grep -q "MCS_SMOKE builtIns=\[markdown\] plugins=\[ru.mcs.plugin.template\]" external-smoke.log
          grep -q "template.hello" external-smoke.log
          grep -q "toolwindow.toggle.template.panel" external-smoke.log
          grep -q "builtInFailures={}" external-smoke.log
