name: build

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew build :app:devHome
        shell: bash
      - name: Build standalone plugin template
        run: ./gradlew -p plugin-template build
        shell: bash
      - name: Build runtime image
        run: ./gradlew :app:jlink
        shell: bash
      - name: Smoke test of the runtime image (bundled plugin via ModuleLayer)
        shell: bash
        run: |
          test -f app/build/image/system-plugins/hello/plugin.yml
          EXE=app/build/image/bin/manuscriptium
          if [ "$RUNNER_OS" = "Windows" ]; then EXE=$EXE.bat; fi
          "$EXE" --smoke --home=app/build/dev-home | tee smoke.log
          grep -q "MCS_SMOKE plugins=\[ru.mcs.plugin.hello\]" smoke.log
      - name: Smoke test of the runtime image (bundled Hello + external template JAR)
        shell: bash
        run: |
          TEMPLATE_DIR=app/build/external-home/plugins/template
          TEMPLATE_JAR=plugin-template/build/libs/manuscriptium-plugin-template-0.1.0.jar
          mkdir -p "$TEMPLATE_DIR"
          cp "$TEMPLATE_JAR" "$TEMPLATE_DIR/template.jar"
          (cd "$TEMPLATE_DIR" && jar xf "$OLDPWD/$TEMPLATE_JAR" plugin.yml)
          EXE=app/build/image/bin/manuscriptium
          if [ "$RUNNER_OS" = "Windows" ]; then EXE=$EXE.bat; fi
          "$EXE" --smoke --home=app/build/external-home | tee external-smoke.log
          grep -q "MCS_SMOKE plugins=\[ru.mcs.plugin.hello, ru.mcs.plugin.template\]" external-smoke.log
          grep -q "template.hello" external-smoke.log
          grep -q "toolwindow.toggle.template.panel" external-smoke.log
