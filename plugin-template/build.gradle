plugins {
    id 'java-library'
}

group = 'ru.mcs.plugin'
version = '0.1.0'

sourceSets {
    // Стандартные src/markdownExtension/{java,resources}; отдельный JPMS-модуль и plugin.yml.
    markdownExtension {}
}

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    // SDK предоставляется Manuscriptium во время выполнения и не упаковывается в плагин.
    compileOnly 'ru.mcs:spi-swing:0.1.0-SNAPSHOT'

    // Второй, независимый JAR: расширение формата использует только публичный API языкового модуля.
    markdownExtensionCompileOnly 'ru.mcs:spi-swing:0.1.0-SNAPSHOT'
    markdownExtensionCompileOnly 'ru.mcs:markdown:0.1.0-SNAPSHOT'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.named('jar') {
    archiveBaseName = 'manuscriptium-plugin-template'
}

tasks.register('markdownExtensionJar', Jar) {
    group = 'build'
    description = 'Builds the standalone Markdown API extension example.'
    from sourceSets.markdownExtension.output
    archiveBaseName = 'manuscriptium-markdown-extension'
}

tasks.named('build') {
    dependsOn 'markdownExtensionJar'
}
