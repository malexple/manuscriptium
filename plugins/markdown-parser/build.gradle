java {
    modularity.inferModulePath = false
}

// У Flexmark 0.64.8 нет Automatic-Module-Name, поэтому Gradle оставляет эти JAR в classpath.
// Для JPMS-плагина весь compileClasspath должен быть настоящим module path.
tasks.named('compileJava') {
    classpath = files()
    options.compilerArgumentProviders.add({
        ['--module-path', configurations.compileClasspath.asPath]
    } as org.gradle.process.CommandLineArgumentProvider)
}

dependencies {
    compileOnly project(':spi')

    implementation "com.vladsch.flexmark:flexmark:${flexmarkVersion}"
    implementation "com.vladsch.flexmark:flexmark-ext-yaml-front-matter:${flexmarkVersion}"
    implementation "com.vladsch.flexmark:flexmark-ext-wikilink:${flexmarkVersion}"
    implementation "com.vladsch.flexmark:flexmark-ext-footnotes:${flexmarkVersion}"
    implementation "com.vladsch.flexmark:flexmark-ext-gfm-tasklist:${flexmarkVersion}"
    implementation "com.vladsch.flexmark:flexmark-ext-tables:${flexmarkVersion}"
    implementation "com.vladsch.flexmark:flexmark-ext-gfm-strikethrough:${flexmarkVersion}"

    testImplementation project(':spi')
    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
}

// Плагин получает собственный module path: SPI остаётся в родительском слое,
// а Flexmark и его транзитивные зависимости упаковываются рядом с plugin JAR.
tasks.register('pluginRuntime', Sync) {
    from(configurations.runtimeClasspath.filter { file -> !file.name.startsWith('spi-') })
    into layout.buildDirectory.dir('plugin-runtime')
}
