id: ru.mcs.plugin.hello
name: Hello (test plugin)
version: 0.1.0
sdk-version: "0.8"
module: ru.mcs.plugin.hello
depends-on: []
permissions: []

# onDemand: код плагина загружается при первом использовании любого из вкладов ниже.
activation: onDemand

# База имени переводов внутри jar: messages.properties (en) и messages_ru.properties.
# Значения вида "%ключ" в text/title берутся из этих файлов.
i18n: ru/mcs/plugin/hello/messages

contributions:
  actionGroups:
    - id: hello.group
      text: "%group.hello"
      popup: true
      groups: [MainMenu.Tools]
  actions:
    - id: hello.say
      text: "%action.say"
      groups: [hello.group, MainToolbar, EditorTabPopup]
    - id: hello.counter
      text: "%action.counter"
      groups: [hello.group]
    - id: hello.notify
      text: "%action.notify"
      groups: [hello.group]
    - id: hello.task
      text: "%action.task"
      groups: [hello.group]
  toolWindows:
    - id: hello.panel
      title: "%toolwindow.panel"
      anchor: left
    - id: hello.log
      title: "%toolwindow.log"
      anchor: bottom
    - id: hello.info
      title: "%toolwindow.info"
      anchor: right
  fileEditors:
    - id: hello.editor
      patterns: ["*.hello"]
      priority: 10
