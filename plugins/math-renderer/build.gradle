java {
    modularity.inferModulePath = false
}

// JLaTeXMath является automatic module; весь compileClasspath передаём как module path.
tasks.named('compileJava') {
    classpath = files()
    options.compilerArgumentProviders.add({
        ['--module-path', configurations.compileClasspath.asPath]
    } as org.gradle.process.CommandLineArgumentProvider)
}

dependencies {
    compileOnly project(':spi-swing')
    implementation "org.scilab.forge:jlatexmath:${jlatexmathVersion}"

    testImplementation project(':spi-swing')
    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation "org.assertj:assertj-core:${assertjVersion}"
}

tasks.register('pluginRuntime', Sync) {
    from(configurations.runtimeClasspath.filter { file -> !file.name.startsWith('spi-') })
    into layout.buildDirectory.dir('plugin-runtime')
}
