plugins {
    id 'application'
    id 'org.beryx.jlink' version '4.2.0'
}

sourceSets {
    minimalSmoke {
        java.srcDir 'src/minimalSmoke/java'
        resources.srcDir 'src/minimalSmoke/resources'
    }
}

dependencies {
    implementation project(':core')
    implementation project(':editor')
    implementation project(':markdown')
    implementation project(':search')

    // Независимый тестовый состав внутри app: основной output и markdown сюда не попадают.
    minimalSmokeImplementation project(':core')
    minimalSmokeImplementation project(':editor')
}

application {
    mainModule = 'ru.mcs.app'
    mainClass = 'ru.mcs.app.ManuscriptiumApp'
}

// Внешние JAR: build/dev-home/plugins. Встроенные editor/markdown находятся в boot ModuleLayer.
def devHomeDir = layout.buildDirectory.dir('dev-home')
def retiredBundledPlugins = ['hello', 'markdown-editor', 'markdown-parser', 'math-renderer',
                             'editor-styles', 'notes', 'properties']

tasks.register('devHome') {
    doLast {
        // Удаляем только следы прежних сборок; установленные пользователем внешние JAR не затрагиваются.
        retiredBundledPlugins.each { id ->
            devHomeDir.get().dir("plugins/${id}").asFile.deleteDir()
        }
        devHomeDir.get().asFile.mkdirs()
    }
}

tasks.named('run', JavaExec) {
    dependsOn 'devHome', 'classes'
    dependsOn configurations.runtimeClasspath
    systemProperty 'manuscriptium.home', devHomeDir.get().asFile.absolutePath
    jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'

    // Flexmark не объявляет Automatic-Module-Name: Gradle оставляет его на classpath,
    // хотя ru.mcs.markdown требует эти JAR как automatic modules. Передаём весь runtime path явно.
    // mainModule остаётся активным, а пустой classpath отключает автоматическое разбиение JAR.
    modularity.inferModulePath = true
    classpath = files()
    jvmArgumentProviders.add({
        ['--module-path', sourceSets.main.runtimeClasspath.asPath]
    } as org.gradle.process.CommandLineArgumentProvider)
}

tasks.register('minimalSmoke', JavaExec) {
    group = 'verification'
    description = 'Opens, edits, undo/redoes and saves a text file with core + editor, without markdown.'
    dependsOn 'minimalSmokeClasses'
    mainModule = 'ru.mcs.app'
    mainClass = 'ru.mcs.app.MinimalSmoke'
    modularity.inferModulePath = true
    classpath = sourceSets.minimalSmoke.runtimeClasspath
    systemProperty 'java.awt.headless', 'true'
    systemProperty 'file.encoding', 'UTF-8'

    doFirst {
        String runtimePath = sourceSets.minimalSmoke.runtimeClasspath.asPath
        if (runtimePath.split(java.util.regex.Pattern.quote(File.pathSeparator)).any {
            it.endsWith('/markdown') || it.contains('/markdown/build/') || it.contains('\\markdown\\build\\')
        }) {
            throw new GradleException('minimalSmoke runtime path must not contain markdown: ' + runtimePath)
        }
    }
}

tasks.named('check') {
    dependsOn 'minimalSmoke'
}

jlink {
    options = ['--strip-debug', '--compress', 'zip-6', '--no-header-files', '--no-man-pages']
    launcher {
        name = 'manuscriptium'
    }
    // Если сборка жалуется на merged module: ./gradlew :app:suggestMergedModuleInfo
    // и скопируйте блок mergedModule { ... } сюда.
}
