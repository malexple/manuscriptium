plugins {
    id 'application'
    id 'org.beryx.jlink' version '4.2.0'
}

def bundledPlugins = ['hello', 'notes', 'properties']
bundledPlugins.each { evaluationDependsOn(":plugins:${it}") }

dependencies {
    implementation project(':core')
}

application {
    mainModule = 'ru.mcs.app'
    mainClass = 'ru.mcs.app.ManuscriptiumApp'
}

// Внешние плагины: build/dev-home/plugins; bundled: build/system-plugins и image/system-plugins.
def devHomeDir = layout.buildDirectory.dir('dev-home')
def systemPluginsDir = layout.buildDirectory.dir('system-plugins')

tasks.register('systemPlugins', Sync) {
    bundledPlugins.each { id ->
        def plugin = project(":plugins:${id}")
        dependsOn plugin.tasks.named('jar')
        from(plugin.tasks.named('jar')) { into id }
        from(plugin.file('plugin.yml')) { into id }
    }
    into systemPluginsDir
}

tasks.register('devHome') {
    dependsOn 'systemPlugins'
    doLast {
        // Bundled-плагины не должны дублироваться во внешнем каталоге dev-home.
        bundledPlugins.each { id ->
            devHomeDir.get().dir("plugins/${id}").asFile.deleteDir()
        }
        devHomeDir.get().asFile.mkdirs()
    }
}

tasks.register('imageSystemPlugins', Sync) {
    dependsOn 'systemPlugins'
    from systemPluginsDir
    into layout.buildDirectory.dir('image/system-plugins')
}

tasks.named('run') {
    dependsOn 'devHome'
    systemProperty 'manuscriptium.home', devHomeDir.get().asFile.absolutePath
    systemProperty 'manuscriptium.systemPlugins', systemPluginsDir.get().asFile.absolutePath
    jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
}

tasks.named('jlink') {
    finalizedBy 'imageSystemPlugins'
}

jlink {
    options = ['--strip-debug', '--compress', 'zip-6', '--no-header-files', '--no-man-pages']
    launcher {
        name = 'manuscriptium'
    }
    // Если сборка жалуется на merged module: ./gradlew :app:suggestMergedModuleInfo
    // и скопируйте блок mergedModule { ... } сюда.
}
